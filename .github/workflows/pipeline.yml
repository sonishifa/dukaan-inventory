# CI/CD pipeline for Dukaan
#
#   every push, every PR  ->  1. Lint, test and build   (with a real Postgres)
#                             2. Docker build and smoke test
#   pull request to main  ->  3. Deploy preview  (preview DB, sample data, health check, link on the PR)
#   push to main          ->  3. Deploy production (migrate production DB, deploy, health check)
#                             4. Publish Docker image to GitHub Container Registry
#
# If any job fails, the jobs after it do not run, so broken code never deploys.

name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dukaan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dukaan_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run database migrations on the test database
        run: npm run migrate

      - name: Run unit and integration tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Production build
        run: npm run build

  docker:
    name: Docker build and smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start app + Postgres with docker compose
        run: docker compose up -d --build

      - name: Wait for the container to report healthy
        run: ATTEMPTS=20 DELAY=3 sh scripts/health-check.sh http://localhost:3000

      - name: Check a page and an API call through the container
        run: |
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS http://localhost:3000/api/products | grep -q '"products"'

      - name: Show container logs if something failed
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v

  deploy-preview:
    name: Deploy preview
    if: github.event_name == 'pull_request'
    needs: [test, docker]
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Migrate the preview database
        run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}

      - name: Load sample products into the preview database
        run: npm run seed
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}

      - name: Install Vercel CLI
        run: npm install --global vercel@65

      - name: Build for Vercel (preview)
        run: |
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          # The app is already built. Removing .git stops the Vercel CLI from sending
          # the commit author, which the Hobby plan blocks unless they are on the Vercel team.
          rm -rf .git
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Health check the preview
        run: sh scripts/health-check.sh "${{ steps.deploy.outputs.url }}"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Post the preview link on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview is live and healthy: ${{ steps.deploy.outputs.url }}\n\nCommit: ${context.sha.slice(0, 7)}. The preview uses the preview database with sample products.`,
            });

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Migrate the production database
        run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Install Vercel CLI
        run: npm install --global vercel@65

      - name: Build for Vercel (production)
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        id: deploy
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          # The app is already built. Removing .git stops the Vercel CLI from sending
          # the commit author, which the Hobby plan blocks unless they are on the Vercel team.
          rm -rf .git
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          # Check the public production address if it is configured, else the new deployment
          echo "url=${PRODUCTION_URL:-$url}" >> "$GITHUB_OUTPUT"

      - name: Health check production
        run: sh scripts/health-check.sh "${{ steps.deploy.outputs.url }}"

  publish-image:
    name: Publish Docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name in lowercase
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GITHUB_SHA=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
